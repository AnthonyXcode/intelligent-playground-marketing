[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Apex -> www (set www.intelligent-playground.com as the primary domain in Netlify)
[[redirects]]
  from = "https://intelligent-playground.com/*"
  to = "https://www.intelligent-playground.com/:splat"
  status = 301
  force = true

# Note: Netlify also reads dist/_headers (copied from public/ for Cloudflare Pages);
# the values there are identical to these.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    X-Frame-Options = "SAMEORIGIN"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
